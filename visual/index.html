<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- 로딩 -->
  <section id="loading">
    <div class="sandbox-wrap">
      <div class="sandbox-con sandbox-con-1">
        <div class="sandbox blue"></div>
        <div class="sandbox red"></div>
      </div>      
      <div class="sandbox-con sandbox-con-2">
        <div class="sandbox yellow"></div>
        <div class="sandbox black"></div>
      </div>      
      <div class="sandbox-con sandbox-con-3">
        <div class="sandbox black"></div>
        <div class="sandbox yellow"></div>
      </div>      
      <div class="sandbox-con sandbox-con-4">
        <div class="sandbox red"></div>
        <div class="sandbox blue"></div>
        </div>
      </div>
  </section>

  <!-- 헤더 -->
  <header>
    <div class="header-con">
      <nav> 
        <ul class="drop-down">
          <input type="text">
          <li>도서관소개</li>
          <ul class="drop-menu">
            <a href=""><li>도서관소개</li></a>
            <a href=""><li>도서관현황</li></a>
          </ul>
        </ul>
        <ul class="drop-down">
          <input type="text">
          <li>자료실</li>
          <ul class="drop-menu">
            <a href=""><li>자료실</li></a>
            <a href=""><li>열람실예약</li></a>
          </ul>
        </ul>
        <ul class="drop-down">
          <input type="text">        
          <li>회원서비스</li>
          <ul class="drop-menu">
            <a href=""><li>회원가입</li></a>
            <a href=""><li>마이페이지</li></a>
          </ul>
        </ul>
        <ul class="drop-down">
          <li>도서검색</li>
        </ul>
      </nav>
      <ul class="account">
        <a href="#"><li>회원가입</li></a>
        <a href="#"><li>로그인</li></a>
        <a href="#"><li>관리자</li></a>
      </ul>
    </div>
  </header>
  <section id="visual">
    <div class="visual-con">
      <div class="visual-title"></div>
      <div class="visual-slide">
        <div class="top">
          <div class="sandbox-wrap">
            <div class="sandbox-con sandbox-con-1">
              <div class="sandbox blue"></div>
              <div class="sandbox red"></div>
            </div>      
            <div class="sandbox-con sandbox-con-2">
              <div class="sandbox yellow"></div>
              <div class="sandbox black"></div>
            </div>      
            <div class="sandbox-con sandbox-con-3">
              <div class="sandbox black"></div>
              <div class="sandbox yellow"></div>
            </div>      
            <div class="sandbox-con sandbox-con-4">
              <div class="sandbox red"></div>
              <div class="sandbox blue"></div>
            </div>
          </div>
          
          <div class="semicircle-wrap">
            <div class="rotate-con">
              <div class="semicircle"></div>
            </div>
          </div>
          
          <div class="scale-box-wrap">
            <div class="scale-box"></div>
          </div>
        </div>  
        
        
        <div class="middle">
          
          <div class="eclipse-wrap">
            <div class="eclipse-con">
              <div class="eclipse eclipse1"></div>
            </div>      
            <div class="eclipse-con">
              <div class="eclipse eclipse2"></div>
            </div>      
          </div>
          
          <div class="arrow-wrap">
            <div class="arrow-con">
              <div class="arrow"></div>
              <div class="arrow"></div>
              <div class="arrow"></div>
              <div class="arrow"></div>
              <div class="arrow"></div>
              <div class="arrow"></div>
            </div>
          </div>
          
        </div>
        
        <div class="bottom">
          <div class="push">
            <div class="push-bar"></div>
            <div class="push-circles">
              <div class="push-circle"></div>
              <div class="push-circle"></div>
              <div class="push-circle"></div>
            </div>
          </div>
          <div class="piston">
            <div class="piston-con"></div>
            <div class="piston-bar"></div>
            <div class="piston-circle"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
